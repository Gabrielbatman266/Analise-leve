name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Assinatura: usa os segredos LEVE_KEYSTORE_B64 + LEVE_KEYSTORE_PASS se existirem.
      # Sem eles, guarda uma chave gerada no cache do Actions (vale enquanto o cache não expirar).
      - name: Recuperar chave do cache
        uses: actions/cache@v4
        with:
          path: ~/.leve-key
          key: leve-signing-key-v1

      - name: Preparar assinatura
        env:
          KS_B64: ${{ secrets.LEVE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LEVE_KEYSTORE_PASS }}
        run: |
          mkdir -p ~/.leve-key
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.leve-key/leve.jks
            PASS="$KS_PASS"
          else
            if [ ! -f ~/.leve-key/leve.jks ]; then
              head -c 18 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' > ~/.leve-key/pass
              keytool -genkeypair -keystore ~/.leve-key/leve.jks -storepass "$(cat ~/.leve-key/pass)" \
                -keypass "$(cat ~/.leve-key/pass)" -alias leve -keyalg RSA -keysize 2048 -validity 20000 \
                -dname "CN=Leve, O=Leve, C=BR"
            fi
            PASS="$(cat ~/.leve-key/pass)"
          fi
          echo "::add-mask::$PASS"
          echo "LEVE_KEYSTORE_PATH=$HOME/.leve-key/leve.jks" >> "$GITHUB_ENV"
          echo "LEVE_KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk AnaliseLeve.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnaliseLeve
          path: AnaliseLeve.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Análise Leve 1.0.${{ github.run_number }}
          files: AnaliseLeve.apk
          make_latest: true
